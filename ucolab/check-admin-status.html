<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Admin Status - Debug Tool</title>
    <link rel="icon" href="/graphics/inttoFavicon.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .section {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .section h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-logged-in {
            background: #d4edda;
            color: #155724;
        }
        .status-logged-out {
            background: #f8d7da;
            color: #721c24;
        }
        .status-admin {
            background: #fff3cd;
            color: #856404;
        }
        .status-regular {
            background: #d1ecf1;
            color: #0c5460;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .info-row:last-child {
            border-bottom: none;
        }
        .info-label {
            font-weight: 600;
            color: #666;
        }
        .info-value {
            color: #333;
            font-family: 'Courier New', monospace;
        }
        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }
        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .btn-secondary {
            background: #6c757d;
        }
        .btn-secondary:hover {
            background: #5a6268;
        }
        .btn-danger {
            background: #dc3545;
        }
        .btn-danger:hover {
            background: #c82333;
        }
        .loading {
            text-align: center;
            color: #666;
            padding: 20px;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .console-log {
            background: #1e1e1e;
            color: #00ff00;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .icon {
            width: 20px;
            height: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Admin Status Debug Tool</h1>
        <p class="subtitle">Check if your account has admin privileges and test the redirect functionality</p>
        
        <div id="content">
            <div class="loading">⏳ Loading user data...</div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

    <script>
        // Initialize Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAXNIo4h3Uv7Z8IGdm01zQ8K4WY4G8VLzE",
            authDomain: "uc-intto.firebaseapp.com",
            projectId: "uc-intto",
            storageBucket: "uc-intto.firebasestorage.app",
            messagingSenderId: "156771180433",
            appId: "1:156771180433:web:4f9d57eb6b0e7882ef0430",
            measurementId: "G-ETY9E0F1K6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let logs = [];
        function addLog(message) {
            const timestamp = new Date().toLocaleTimeString();
            logs.push(`[${timestamp}] ${message}`);
        }

        // Monitor auth state
        auth.onAuthStateChanged(async (user) => {
            const content = document.getElementById('content');
            
            if (!user) {
                // User not logged in
                content.innerHTML = `
                    <div class="error">
                        ❌ You are not logged in. Please sign in first.
                    </div>
                    <div class="section">
                        <p>Go back to the main page and sign in with your account.</p>
                        <button class="btn" onclick="window.location.href='index.html'">Go to Main Page</button>
                    </div>
                `;
                return;
            }

            addLog('User authenticated: ' + user.email);

            // User is logged in, fetch Firestore data
            try {
                const userDocRef = db.collection('Registered Accounts').doc(user.uid);
                addLog('Fetching Firestore document: Registered Accounts/' + user.uid);
                
                const userDoc = await userDocRef.get();
                
                if (!userDoc.exists()) {
                    addLog('ERROR: User document does not exist in Firestore!');
                    content.innerHTML = `
                        <div class="error">
                            ❌ User profile not found in Firestore database!
                        </div>
                        <div class="section">
                            <h2>⚠️ Database Issue</h2>
                            <p>Your account exists in Firebase Authentication but not in the Firestore database.</p>
                            <p><strong>Solution:</strong> Sign out and sign up again to create your profile.</p>
                            <button class="btn btn-danger" onclick="firebase.auth().signOut().then(() => window.location.href='index.html')">Sign Out</button>
                        </div>
                        <div class="section">
                            <h2>📋 Console Logs</h2>
                            <div class="console-log">${logs.join('\n')}</div>
                        </div>
                    `;
                    return;
                }

                const userData = userDoc.data();
                addLog('User document found!');
                addLog('isAdmin field value: ' + JSON.stringify(userData.isAdmin));
                addLog('isAdmin field type: ' + typeof userData.isAdmin);
                addLog('Full user data: ' + JSON.stringify(userData, null, 2));

                const isAdmin = userData.isAdmin || false;
                const isAdminStrict = userData.isAdmin === true;

                // Display results
                content.innerHTML = `
                    <div class="${isAdmin ? 'success' : 'section'}">
                        <h2>
                            ${isAdmin ? '👑' : '👤'} Current User Status
                            <span class="status-badge ${isAdmin ? 'status-admin' : 'status-regular'}">
                                ${isAdmin ? 'ADMIN' : 'REGULAR USER'}
                            </span>
                        </h2>
                    </div>

                    <div class="section">
                        <h2>🔍 Account Information</h2>
                        <div class="info-row">
                            <span class="info-label">UID:</span>
                            <span class="info-value">${user.uid}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Email:</span>
                            <span class="info-value">${user.email}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Display Name:</span>
                            <span class="info-value">${userData.displayName || 'N/A'}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Affiliation:</span>
                            <span class="info-value">${userData.affiliation || 'N/A'}</span>
                        </div>
                    </div>

                    <div class="section">
                        <h2>🛡️ Admin Status Details</h2>
                        <div class="info-row">
                            <span class="info-label">isAdmin (Raw Value):</span>
                            <span class="info-value">${JSON.stringify(userData.isAdmin)}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">isAdmin (Type):</span>
                            <span class="info-value">${typeof userData.isAdmin}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">isAdmin || false:</span>
                            <span class="info-value">${isAdmin}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">isAdmin === true:</span>
                            <span class="info-value">${isAdminStrict}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Expected Redirect:</span>
                            <span class="info-value">${isAdminStrict ? '/admin/dashboard.html' : 'Stay on current page'}</span>
                        </div>
                    </div>

                    <div class="section">
                        <h2>🧪 Test Redirect Functionality</h2>
                        <p>Click the button below to simulate what happens when you sign in:</p>
                        <button class="btn" onclick="testRedirect(${isAdminStrict})">
                            ${isAdminStrict ? '🚀 Test Admin Redirect' : '✅ Test Regular User Login'}
                        </button>
                        <button class="btn btn-secondary" onclick="window.location.href='index.html'">Back to Main Page</button>
                    </div>

                    <div class="section">
                        <h2>📋 Console Logs</h2>
                        <div class="console-log">${logs.join('\n')}</div>
                    </div>

                    ${!isAdmin ? `
                    <div class="section">
                        <h2>ℹ️ How to Become an Admin</h2>
                        <p>To set your account as admin, you need to manually update Firestore:</p>
                        <ol style="padding-left: 20px; margin-top: 10px;">
                            <li>Go to <a href="https://console.firebase.google.com" target="_blank" style="color: #667eea;">Firebase Console</a></li>
                            <li>Select your project: <strong>uc-intto</strong></li>
                            <li>Navigate to: <strong>Firestore Database</strong></li>
                            <li>Find collection: <strong>Registered Accounts</strong></li>
                            <li>Find your document: <strong>${user.uid}</strong></li>
                            <li>Edit the <strong>isAdmin</strong> field</li>
                            <li>Change value to: <strong>true</strong> (boolean, not string)</li>
                            <li>Save and try signing in again</li>
                        </ol>
                    </div>
                    ` : ''}
                `;

            } catch (error) {
                addLog('ERROR: ' + error.message);
                console.error('Error fetching user data:', error);
                content.innerHTML = `
                    <div class="error">
                        ❌ Error fetching user data: ${error.message}
                    </div>
                    <div class="section">
                        <h2>📋 Console Logs</h2>
                        <div class="console-log">${logs.join('\n')}</div>
                    </div>
                `;
            }
        });

        function testRedirect(isAdmin) {
            if (isAdmin === true) {
                if (confirm('You are an admin! This will redirect you to the admin dashboard. Continue?')) {
                    window.location.href = '../admin/dashboard.html';
                }
            } else {
                alert('You are a regular user. No redirect will occur. The modal would simply close on the main page.');
            }
        }
    </script>
</body>
</html>
