    <script>
        // Firebase Configuration and Initialization
        const firebaseConfig = {
            apiKey: "AIzaSyAXNIo4h3Uv7Z8IGdm01zQ8K4WY4G8VLzE",

        };

        firebase.initializeApp(firebaseConfig);
        
        // Global References
        const auth = firebase.auth();
        const db = firebase.firestore();
        async function saveUserToFirestore(user, loginType, extraData = {}) {
            const userRef = db.collection('users').doc(user.uid);
            
            const userData = {
                uid: user.uid,
                email: user.email,
                displayName: user.displayName || extraData.firstName + ' ' + extraData.lastName || 'N/A',
                firstName: extraData.firstName || user.displayName?.split(' ')[0] || 'N/A',
                lastName: extraData.lastName || user.displayName?.split(' ').slice(1).join(' ') || 'N/A',
                affiliation: extraData.affiliation || 'N/A',
                loginType: loginType,
                lastLogin: firebase.firestore.FieldValue.serverTimestamp(),
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };

            try {
                await userRef.set(userData, { merge: true });
            } catch (error) {
                console.error("Error writing user to Firestore: ", error);
            }
        }
    </script>
